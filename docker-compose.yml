services:
  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repolens-api
    # Use single worker to avoid duplicate startup tasks (demo loading)
    # Redis lock also prevents race conditions, but 1 worker is simpler
    command: sh -c "chown -R 1000:1000 /app/cache && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    user: "1000:1000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      - REDIS_URL=redis://redis:6379/0
      - DEMO_AUTO_LOAD=true
      - PRELOAD_MODEL=true
      - LOG_LEVEL=INFO
      - SERVICE_NAME=repolens-api
      - HF_HOME=/app/cache/huggingface
      - TRANSFORMERS_CACHE=/app/cache/huggingface
      - TORCH_HOME=/app/cache/torch
    volumes:
      - ./:/app
      - /app/__pycache__
      - /app/.pytest_cache
      - model_cache:/app/cache
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - repolens-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.26  # 5.15+ required for CREATE VECTOR INDEX
    container_name: repolens-neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=512M
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - repolens-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: repolens-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - repolens-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M

  # RQ Worker for Background Tasks
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repolens-worker
    command: sh -c "cd /app && python run_worker.py"
    volumes:
      - ./:/app
      - /app/__pycache__
      - model_cache:/home/repolens/.cache
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      - REDIS_URL=redis://redis:6379/0
      - PRELOAD_MODEL=true
      - LOG_LEVEL=INFO
      - SERVICE_NAME=repolens-worker
      - HF_HOME=/home/repolens/.cache/huggingface
      - TORCH_HOME=/home/repolens/.cache/torch
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - repolens-network
    deploy:
      resources:
        limits:
          cpus: '2'          # Restored original 2 CPUs
          memory: 3G         # Restored original 3GB
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  redis_data:
    driver: local
  model_cache:
    driver: local

networks:
  repolens-network:
    driver: bridge
